# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.caching=true

# Mod properties
mod.version=1.7.0
mod.group=com.wulian.texturelocaleredirector
mod.id=texturelocaleredirector
mod.name=Texture-Locale-Redirector

# Used for the mod metadata
mod.mc_dep_fabric=[VERSIONED]
mod.mc_dep_forgelike=[VERSIONED]
# Used for the release title. I.e. '1.20.x'
mod.mc_title=[VERSIONED]
# Space separated versions for publishing. I.e. '1.20, 1.20.1'
mod.mc_targets=[VERSIONED]

# Mod setup
deps.fabric_loader=0.19.5
deps.fabric_api=[VERSIONED]
deps.forge_loader=[VERSIONED]
deps.neoforge_loader=[VERSIONED]

# Loom 1.17 uses a no-remap plugin for unobfuscated Minecraft 26.1+.
loomx.loom_version=1.17.491
loomx.loom_remap_plugin=dev.architectury.loom
loomx.loom_unobf_plugin=dev.architectury.loom-no-remap

# Publishing
publish.modrinth=oXy2xYgU
publish.curseforge=1323738
publish.version_type=release
publish.mod_side=client
