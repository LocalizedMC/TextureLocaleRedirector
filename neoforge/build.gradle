architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = rootProject.archives_base_name + "-neoforge"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)
    developmentNeoForge.extendsFrom(common)

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.ftb.mods:ftb-quests-neoforge:${rootProject.ftb_quests_version}"

    modImplementation(include("me.fallenbreath:conditional-mixin-neoforge:${rootProject.conditional_mixin_version}"))

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) {
        transitive = false
    }
}

processResources {
    inputs.property("version", project.version)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(version: project.version)
    }
}

shadowJar {
    exclude("fabric.mod.json")
    exclude("architectury.common.json")

    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    archiveClassifier.set((String) null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").tasks.named("sourcesJar")
    dependsOn(commonSources)
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
}
