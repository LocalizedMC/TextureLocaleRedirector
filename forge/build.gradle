architectury {
    platformSetupLoomIde()
    forge()
}

base {
    archivesName = rootProject.archives_base_name + "-forge"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)
    developmentForge.extendsFrom(common)

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    forge {
        convertAccessWideners = true
        mixinConfig "texturelocaleredirector.mixins.json"
    }
}

repositories {
    maven { url = "https://maven.ftb.dev/releases" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modApi "dev.ftb.mods:ftb-quests-forge:${rootProject.ftb_quests_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionForge")) {
        transitive = false
    }
}

processResources {
    inputs.property("version", project.version)

    filesMatching("META-INF/mods.toml") {
        expand(version: project.version)
    }
}

shadowJar {
    exclude("fabric.mod.json")
    exclude("architectury.common.json")

    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    archiveClassifier.set((String) null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").tasks.named("sourcesJar")
    dependsOn(commonSources)
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
}
